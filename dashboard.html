<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrangle Tabs</title>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Wrangle Tabs <span class="version" id="version"></span></h1>
      <div class="header-actions"><button id="propose">New group<kbd>n</kbd></button><button id="undo" disabled>Undo</button><button id="help" aria-label="Help">?<span class="sr-only"> Help</span></button></div>
    </header>

    <div class="grid">
      <main>
        <div class="filterbar">
          <input id="filter" type="search" placeholder="Filter by title or site  ( / )" aria-label="Filter suggestions" autocomplete="off">
        </div>
        <div id="list" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="Suggested changes">
          <div class="row info">Reading your tabs…</div>
        </div>
      </main>
    </div>
  </div>

  <footer class="applybar"><div class="in"><div class="cururl" id="cururl"></div><div class="ai-footer"><div class="sorter" id="sorter"></div><button id="settings" aria-label="AI settings">AI settings<kbd>s</kbd></button></div></div></footer>


  <div id="overlayRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <script type="module" src="/src/dashboard/main.ts"></script>
</body>
</html>
